name: Project Assurance

on:
  push:
    paths:
      - 'AGENTS.md'
      - 'docs/governance/**'
      - 'docs/research/discovery/problem-baseline.md'
      - 'docs/research/synthesis/requirements-*.md'
      - 'docs/development/**'
      - 'docs/architecture/**'
      - 'tools/requirements/**'
      - 'tools/assurance/**'
      - 'tools/operational/**'
      - 'src/**'
      - 'app/**'
      - 'histo_orla/**'
      - 'tests/**'
      - '.github/workflows/project-assurance.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/governance/**'
      - 'docs/research/discovery/problem-baseline.md'
      - 'docs/research/synthesis/requirements-*.md'
      - 'docs/development/**'
      - 'docs/architecture/**'
      - 'tools/requirements/**'
      - 'tools/assurance/**'
      - 'tools/operational/**'
      - 'src/**'
      - 'app/**'
      - 'histo_orla/**'
      - 'tests/**'
      - '.github/workflows/project-assurance.yml'

permissions:
  contents: read

jobs:
  project-assurance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/requirements/requirements.txt

      - name: Install validator dependency
        run: python -m pip install -r tools/requirements/requirements.txt

      - name: Run requirements assurance regression tests
        run: python -m unittest discover -s tools/requirements/tests -p 'test_*.py' -v

      - name: Run project assurance regression tests
        run: python -m unittest discover -s tools/assurance/tests -p 'test_*.py' -v

      - name: Run operational core regression tests
        run: python -m unittest discover -s tools/operational/tests -p 'test_*.py' -v

      - name: Run formal requirements assurance
        run: python tools/requirements/validate.py

      - name: Resolve changed-files base
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run value decision delivery feedback assurance
        shell: bash
        run: |
          BASE="${{ steps.base.outputs.sha }}"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            python tools/assurance/validate.py --changed-from "$BASE"
          else
            python tools/assurance/validate.py
          fi
