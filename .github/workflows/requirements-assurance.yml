name: Requirements Assurance

on:
  push:
    paths:
      - 'docs/research/synthesis/requirements-*.md'
      - 'docs/development/requirements-coverage.md'
      - 'docs/architecture/requirements-derivation.md'
      - 'docs/architecture/assurance/requirements-assurance-harness.md'
      - 'tools/requirements/**'
      - '.github/workflows/requirements-assurance.yml'
  pull_request:
    paths:
      - 'docs/research/synthesis/requirements-*.md'
      - 'docs/development/requirements-coverage.md'
      - 'docs/architecture/requirements-derivation.md'
      - 'docs/architecture/assurance/requirements-assurance-harness.md'
      - 'tools/requirements/**'
      - '.github/workflows/requirements-assurance.yml'

permissions:
  contents: read

jobs:
  requirements-assurance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/requirements/requirements.txt

      - name: Install validator dependency
        run: python -m pip install -r tools/requirements/requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tools/requirements/tests -p 'test_*.py' -v

      - name: Run formal requirements assurance
        run: python tools/requirements/validate.py
